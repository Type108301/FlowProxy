project_name: flowproxy
seed: 42

# AutoDL 数据盘优先；本机则回落到仓库根目录
paths:
  autodl_root: /root/autodl-tmp/flowproxy
  data_raw: data/raw
  data_processed: data/processed
  outputs: outputs

physics:
  shape: cylinder          # cylinder | square | triangle
  D: 1.0
  U_inf: 1.0
  cx: 0.0
  cy: 0.0
  Re_list: [80, 100, 150, 200]
  cy_offsets: [-0.4, 0.0, 0.4]
  D_scales: [0.9, 1.0, 1.1]

domain:
  x_min: -8.0
  x_max: 20.0
  y_min: -8.0
  y_max: 8.0
  z_span: 0.1

grid:
  nx: 64
  ny: 64

cfd:
  solver: icoFoam
  end_time: 80.0
  delta_t: 0.02
  write_interval: 0.25
  skip_time: 40.0
  n_cells_x: 140
  n_cells_y: 80
  snap_level: 2
  n_procs: 4

data:
  history_k: 4
  future_t: 1
  train_ratio: 0.7
  val_ratio: 0.15
  holdout_re: [200]
  holdout_geometry: ["cylinder_cy0.4_D1.0"]

train:
  device: cuda
  # 圆柱 best.pt 只有权重，没有 epoch。循环从 1 计到这里，即续训 80 个 epoch。
  epochs: 80
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.005
  patience: 40
  num_workers: 2
  amp: true
  lambda_div: 0.05
  lambda_wall: 0.02
  reset_best: true

unetex:
  filters: [8, 16, 32, 32]
  kernel_size: 5
  layers: 2
  batch_norm: false
  weight_norm: false

fno:
  n_modes: [16, 16]
  hidden_channels: 32
  n_layers: 4
  lifting_channels: 64
  projection_channels: 64

vis:
  n_show: 4
  cmap: jet
